<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Background Remover — Private, No Upload | Darkmintis</title>
    <meta
      name="description"
      content="Free, open-source background remover. 100% private, runs in your browser. No upload, no signup, bulk support."
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BG Remover" />
    <link rel="canonical" href="https://darkmintis.github.io/bg-remover/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darkmintis BG Remover" />
    <meta property="og:url" content="https://darkmintis.github.io/bg-remover/" />
    <meta property="og:title" content="Free Background Remover — Private, No Upload" />
    <meta
      property="og:description"
      content="Remove image backgrounds in your browser. Nothing is uploaded. Free, open source, and offline-ready."
    />
    <meta property="og:image" content="https://darkmintis.github.io/bg-remover/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Darkmintis BG Remover — remove backgrounds, keep your privacy."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://darkmintis.github.io/bg-remover/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Darkmintis BG Remover — remove backgrounds, keep your privacy."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      try {
        var choice = localStorage.getItem('theme');
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
